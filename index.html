<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ยอดนักสืบไขปริศนาเมืองอักษรนำ</title>
<style>
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07182b;font-family:"Tahoma","Noto Sans Thai",sans-serif}
#game{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,177.777vh);aspect-ratio:16/9;background:#000;overflow:hidden;box-shadow:0 0 40px #000}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.hot{position:absolute;background:transparent;border:0;cursor:pointer;z-index:5}
.hot:hover{filter:drop-shadow(0 0 10px #fff)}
#hud{position:absolute;right:1.2%;top:1.2%;z-index:20;display:flex;gap:8px;align-items:center}
.hudbtn,.pill{border:2px solid #f6d68d;background:#163c70e8;color:white;border-radius:16px;padding:8px 12px;font-weight:700;box-shadow:0 3px 8px #0008;cursor:pointer}
#score{background:#5d3719e8}
.panel{position:absolute;z-index:10;background:#fff8e7f2;border:4px solid #7a4a25;border-radius:20px;box-shadow:0 10px 35px #0008;padding:22px;color:#2c1c14}
.panel h2{margin:0 0 12px;color:#174d8d;text-align:center;font-size:clamp(22px,2.3vw,42px)}
.panel p{font-size:clamp(15px,1.25vw,24px);line-height:1.55}
.question{left:24%;top:18%;width:52%;min-height:55%}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.opt{font-size:clamp(15px,1.15vw,22px);padding:12px;border-radius:14px;border:3px solid #8bb8e8;background:#eef7ff;cursor:pointer;text-align:left}
.opt.sel{background:#ffe3ed;border-color:#e84c7b}
.action{display:flex;justify-content:center;gap:12px;margin-top:18px}
.bigbtn{border:0;border-radius:18px;padding:12px 26px;font-size:clamp(17px,1.4vw,25px);font-weight:800;color:white;background:linear-gradient(#ffb629,#e78600);box-shadow:0 5px 0 #9a5500;cursor:pointer}
.secondary{background:linear-gradient(#4b9ef2,#1f62b6);box-shadow:0 5px 0 #174678}
.feedback{margin-top:12px;padding:10px;border-radius:12px;text-align:center;font-weight:700;min-height:42px}
.inputName{position:absolute;z-index:8;left:36.3%;top:47.5%;width:27.5%;height:10%;border:0;background:transparent;text-align:center;font-size:clamp(18px,2vw,36px);outline:none;color:#4a3827}
.hidden{display:none!important}
.mission{left:25%;top:22%;width:50%;padding:28px}
.mission h3{text-align:center;color:#9a2d25;font-size:clamp(18px,1.8vw,32px)}
.wordpic{font-size:clamp(64px,8vw,150px);text-align:center;margin:10px}
.textinput{width:100%;font-size:clamp(18px,1.5vw,28px);padding:12px;border:3px solid #315d95;border-radius:12px}
.summary{left:31%;top:20%;width:43%;min-height:58%}
.certname{font-size:clamp(24px,2.3vw,42px);font-weight:800;color:#7b2e18;text-align:center;margin:8px}
#toast{position:absolute;z-index:30;left:50%;bottom:4%;transform:translateX(-50%);background:#000c;color:white;padding:10px 18px;border-radius:20px;opacity:0;transition:.2s}

#videoIntro{position:absolute;inset:0;z-index:100;background:#07182b;display:flex;align-items:center;justify-content:center}
#introVideo{width:100%;height:100%;object-fit:contain;background:#000}
.introControls{position:absolute;left:0;right:0;bottom:3%;z-index:102;display:flex;justify-content:center;gap:14px}
.introBtn{border:3px solid #fff1bd;border-radius:20px;padding:12px 26px;font-size:clamp(17px,1.5vw,28px);font-weight:800;color:white;background:linear-gradient(#ffb629,#df7800);box-shadow:0 5px 0 #8f4a00;cursor:pointer}
.introTitle{position:absolute;top:2.5%;left:50%;transform:translateX(-50%);z-index:102;color:white;background:#123d72dd;border:2px solid #f6d68d;border-radius:18px;padding:8px 20px;font-size:clamp(18px,1.7vw,30px);font-weight:800}

</style>
</head>
<body><div id="game"><div id="stage">
<img id="bg" class="bg" alt="">
<div id="videoIntro">
  <div class="introTitle">🎬 VDO ความรู้ เรื่อง อักษรนำ ป.3</div>
  <video id="introVideo" controls playsinline preload="metadata">
    <source src="./intro.mp4" type="video/mp4">
  </video>
  <div class="introControls">
    <button id="playIntro" class="introBtn">▶ เล่น VDO</button>
    <button id="skipIntro" class="introBtn">เข้าสู่เกม ▶</button>
  </div>
</div>

<div id="hud" class="hidden"><div id="score" class="pill">⭐ 0</div><button id="musicBtn" class="hudbtn">🔊 เปิดเพลง</button></div>
<div id="ui"></div><div id="toast"></div>
</div></div>
<script>
const IMGS=["./bg1.jpg", "./bg2.jpg", "./bg3.jpg", "./bg4.jpg", "./bg5.jpg", "./bg6.jpg", "./bg7.jpg", "./bg8.jpg", "./bg9.jpg", "./bg10.jpg", "./bg11.jpg", "./bg12.jpg"];
const bg=document.getElementById('bg'), ui=document.getElementById('ui'), hud=document.getElementById('hud'), scoreEl=document.getElementById('score'), toast=document.getElementById('toast');
let state={name:'',char:'หญิง',stars:0,pre:0,post:0,base:0,correct:[0,0,0,0],music:false};
let audioCtx=null, musicTimer=null;

function tone(freq=880,dur=.13,type='sine',vol=.12){
  try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.stop(audioCtx.currentTime+dur)}catch(e){}
}
function sfx(ok){ if(ok){tone(880,.11,'sine',.16);setTimeout(()=>tone(1320,.18,'sine',.12),90)}else{tone(190,.28,'sawtooth',.10)}}
function click(){tone(520,.06,'sine',.05)}
function toggleMusic(){
  state.music=!state.music;
  document.getElementById('musicBtn').textContent=state.music?'🔇 ปิดเพลง':'🔊 เปิดเพลง';
  clearInterval(musicTimer);
  if(state.music){
    audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
    // เพลงคลอแนวผจญภัย/ไขปริศนาสำหรับเด็ก เล่นวนเบา ๆ โดยไม่ใช้ไฟล์ภายนอก
    const melody=[392,440,523,587,523,440,392,330,349,392,440,523,494,440,392,349,
                  330,392,440,494,523,587,659,587,523,494,440,392,349,330,294,330];
    const bass=[131,131,147,147,165,165,147,147,131,131,147,147,165,165,196,196];
    let i=0;
    const playBeat=()=>{
      if(!state.music) return;
      const m=melody[i%melody.length], b=bass[Math.floor(i/2)%bass.length];
      tone(m,.34,'triangle',.055);          // ทำนองหลัก
      if(i%2===0) tone(b,.58,'sine',.035); // เบสคลอ
      if(i%4===0) setTimeout(()=>tone(m*2,.16,'sine',.018),110); // ประกายแฟนตาซี
      i++;
    };
    playBeat();
    musicTimer=setInterval(playBeat,390);
  }
}
document.getElementById('musicBtn').onclick=toggleMusic;
function setBg(i){bg.src=IMGS[i]}
function clear(){ui.innerHTML=''}
function hot(x,y,w,h,fn,label=''){let b=document.createElement('button');b.className='hot';b.style.cssText=`left:${x}%;top:${y}%;width:${w}%;height:${h}%`;b.title=label;b.onclick=()=>{click();fn()};ui.appendChild(b)}
function showHud(v=true){hud.classList.toggle('hidden',!v);scoreEl.textContent='⭐ '+state.stars}
function say(t){toast.textContent=t;toast.style.opacity=1;setTimeout(()=>toast.style.opacity=0,1300)}
function pageCover(){clear();setBg(0);showHud(false);hot(29,80,20,12,pageHow,'วิธีเล่น');hot(50,80,20,12,pageSelect,'เริ่มเกม')}
function pageHow(){clear();setBg(1);showHud(false);hot(86,1,12,22,pageCover,'กลับ');hot(0,0,100,100,()=>{},''); let b=document.createElement('button');b.className='hudbtn';b.textContent='← กลับหน้าปก';b.style.cssText='position:absolute;left:2%;bottom:3%;z-index:12';b.onclick=pageCover;ui.appendChild(b)}
function pageSelect(){clear();setBg(2);showHud(true);let inp=document.createElement('input');inp.className='inputName';inp.placeholder='กรอกชื่อของคุณที่นี่';inp.value=state.name;inp.oninput=e=>state.name=e.target.value;ui.appendChild(inp);hot(4,77,24,9,()=>{state.char='หญิง';say('เลือกนักสืบหญิงแล้ว')});hot(72,77,23,9,()=>{state.char='ชาย';say('เลือกนักสืบชายแล้ว')});hot(33,80,34,15,()=>{if(!state.name.trim())return say('กรุณากรอกชื่อผู้เล่น');pageStory()});hot(0,88,12,10,pageCover)}
function pageStory(){clear();setBg(3);showHud(true);hot(8,82,28,13,()=>preTest(0));let b=document.createElement('button');b.className='hudbtn';b.textContent='← กลับหน้าปก';b.style.cssText='position:absolute;right:2%;bottom:3%;z-index:12';b.onclick=pageCover;ui.appendChild(b)}
const preQ=[
['ข้อใดเป็นคำที่มี "อ นำ ย" ทุกคำ',['อย่า - อยู่ - อยาก','อย่า - อิ่ม - อาบ','อยู่ - อ่อน - อ้วน','อยาก - อาย - อ่าว'],0],
['ข้อใดเป็นคำที่มี "ห นำ" ทั้งหมด',['หมอ, หวี, หลับ','กลอง, เปลว, ควาย','พรุ่ง, สร้าง, ตรวจ','บทเรียน, กระดาษ, ตลาด'],0],
['ข้อใดอ่านออกเสียงเป็น 2 พยางค์ (พยางค์แรกออกเสียง อะ กึ่งเสียง พยางค์หลังออกเสียงเหมือนมี ห นำ)',['หมอ (อ่านว่า หมอ)','หมา (อ่านว่า หมา)','อยู่ (อ่านว่า อยู่)','ขนม (อ่านว่า ขะ-หนม)'],3],
['ข้อใดมีคำที่เป็นอักษรนำ',['กล้า','พระ','ตลาด','ปรับ'],2],
['คำว่า "องุ่น" มีพยัญชนะใดเป็นตัวนำ',['อ นำ','ห นำ','ร นำ','ล นำ'],0],
['ข้อใดไม่ใช่คำอักษรนำ',['หวาน','ขยับ','กวาง','จรวด'],2],
['ข้อใดอ่านถูกต้อง',['หลับ อ่านว่า หะ-ลับ','อยู่ อ่านว่า อะ-ยู่','องุ่น อ่านว่า อะ-งุ่น','ถนน อ่านว่า ถะ-หนน'],3],
['คำในข้อใดเป็นอักษรนำ ทุกคำ',['หญ้า ทรง หลับ','อย่า ถนน ตลาด','เหมือน ไทร สร้อย','ศรี หลง หนาว'],1],
['ข้อใดเป็น ห นำ ม',['หมอ','หนาว','หวาน','หงาย'],0],
['ข้อใดมีคำที่มีอักษรนำปนอยู่',['น้องดื่มนมทุกวัน','น้องอยากไปเชียงใหม่','น้องทำการบ้าน','น้องไปโรงเรียน'],1]
];
const postOrder=[4,1,0,3,2,6,9,5,7,8];
function testScreen(kind,idx,score=0){
 clear();setBg(kind==='pre'?5:10);showHud(true);let q=preQ[kind==='pre'?idx:postOrder[idx]],sel=-1;
 let p=document.createElement('div');p.className='panel question';p.innerHTML=`<h2>${kind==='pre'?'แบบทดสอบก่อนเรียน':'แบบทดสอบหลังเรียน'} ข้อ ${idx+1}/10</h2><p><b>${q[0]}</b></p><div class="options">${q[1].map((o,i)=>`<button class="opt" data-i="${i}">${'กขคง'[i]}. ${o}</button>`).join('')}</div><div class="action"><button class="bigbtn">ส่งคำตอบ</button></div><div class="feedback">${kind==='pre'?'ยังไม่เฉลยคำตอบ':'ตอบแล้วระบบจะตรวจทันที'}</div>`;
 ui.appendChild(p);p.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{p.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=+b.dataset.i;click()});
 p.querySelector('.bigbtn').onclick=()=>{if(sel<0)return say('กรุณาเลือกคำตอบ');let ns=score+(sel===q[2]?1:0);if(kind==='post')sfx(sel===q[2]); if(idx<9)testScreen(kind,idx+1,ns);else{if(kind==='pre'){state.pre=ns;pageMap()}else{state.post=ns;finish()}}}
}
function preTest(i){testScreen('pre',i,0)}
function pageMap(){clear();setBg(4);showHud(true);hot(30,25,15,20,()=>missionIntro(1));hot(65,23,15,20,()=>state.base>=1?missionIntro(2):say('ต้องผ่านฐานที่ 1 ก่อน'));hot(70,57,15,20,()=>state.base>=2?missionIntro(3):say('ต้องผ่านฐานที่ 2 ก่อน'));hot(36,62,15,20,()=>state.base>=3?missionIntro(4):say('ต้องผ่านฐานที่ 3 ก่อน'))}
const intros={
1:['ภารกิจ: แฟ้มคดีลับ','จับคู่คำอักษรนำกับคำอ่านที่ถูกต้อง','สังเกตคำอักษรนำและอ่านออกเสียงได้ถูกต้อง'],
2:['ภารกิจ: ตามรอยเงื่อนงำ','ตามรอยเบาะแส เติมคำอักษรนำที่หายไปในประโยค','เลือกใช้คำอักษรนำให้เหมาะกับบริบท'],
3:['ภารกิจ: ไขรหัสลับ','ถอดรหัสคำจากภาพปริศนา','จำแนกคำอักษรนำจากภาพและคำศัพท์'],
4:['ภารกิจ: สรุปสำนวนคดี','รวบรวมหลักฐานจากทุกฐาน แล้วเขียนคำอ่านให้ถูกต้อง','สรุปหลักการอ่านคำอักษรนำ']
};
function missionIntro(n){clear();setBg([6,7,8,9][n-1]);showHud(true);let a=intros[n-1]||intros[n];let p=document.createElement('div');p.className='panel mission';p.innerHTML=`<h2>${intros[n][0]}</h2><h3>เนื้อเรื่อง</h3><p>${intros[n][1]} นักสืบ ${state.name} ต้องไขปริศนาให้สำเร็จเพื่อเปิดเส้นทางไปยังหมู่บ้านถัดไป</p><h3>เป้าหมายการเรียนรู้</h3><p>${intros[n][2]}</p><div class="action"><button class="bigbtn">เริ่มภารกิจ</button><button class="bigbtn secondary">กลับแผนที่</button></div>`;ui.appendChild(p);p.querySelectorAll('button')[0].onclick=()=>startBase(n);p.querySelectorAll('button')[1].onclick=pageMap}
const b1=[
['หมอ','หอ-มอ-ออ',['หอ-มอ-ออ','มอ-ออ','หะ-มอ']],
['หวี','หอ-วอ-อี',['หอ-วอ-อี','หะ-วี','วอ-อี']],
['หนู','หอ-นอ-อู',['หอ-นอ-อู','นะ-หนู','นอ-อู']],
['หนาว','หอ-นอ-อา-วอ',['หอ-นอ-อา-วอ','นะ-หนาว','หนะ-อาว']],
['ใหญ่','หอ-ยอ-ไอ-ไหย-ไม้เอก',['หอ-ยอ-ไอ-ไหย-ไม้เอก','ยะ-ใหญ่','หอ-ญอ-ไอ']],
['ขนม','ขะ-หนม',['ขะ-หนม','ขะ-นม','ขน-มะ']],
['ฉลาม','ฉะ-หลาม',['ฉะ-หลาม','ฉะ-ลาม','ฉะ-หะ-ลาม']],
['ฝรั่ง','ฝะ-หรั่ง',['ฝะ-หรั่ง','ฝะ-รั้ง','ฝะ-หะ-รั่ง']],
['ถนน','ถะ-หนน',['ถะ-หนน','ถะ-นน','ถะ-หะ-นน']],
['ตลก','ตะ-หลก',['ตะ-หลก','ตะ-ลก','ตะ-หะ-ลก']]
];
const b2=[
['น้อง...........กับการเล่นเกมไขคดีมาก',['สนุก','สนาม','สะหนุก'],'สนุก'],
['แม่ใส่...........เพชรวงใหญ่',['แหวม','แหวน','แหวง'],'แหวน'],
['คุณ..........ตรวจรักษาคนไข้',['หมี','หมู','หมอ'],'หมอ'],
['ฉัน...........บ้านกับคุณตาและคุณยาย',['อยู่','อยาก','อย่า'],'อยู่'],
['แม่ทำอาหารรสชาติ..............มาก',['อะหร่อย','อร่อย','อหร่อย'],'อร่อย']
];
const pics=[['ขนม','🍰'],['ขนุน','🍈'],['สมอง','🧠'],['องุ่น','🍇'],['ตลาด','🏪'],['สนาม','🏟️'],['จรวด','🚀'],['ฝรั่ง','🍐'],['จมูก','👃'],['อร่อย','😋']];
const b4=[['ขยะ','ขะ-หยะ'],['สนาม','สะ-หนาม'],['องุ่น','อะ-หงุ่น'],['สมอง','สะ-หมอง'],['ตลอด','ตะ-หลอด']];
function startBase(n){ if(n===1)base1(0); if(n===2)base2(0); if(n===3)base3(0); if(n===4)base4(0)}
function base1(i){let d=b1[i], opts=[...d[2]].sort(()=>Math.random()-.5);baseChoice(6,1,i,10,`คำว่า “${d[0]}” อ่านว่าอย่างไร?`,opts,d[1],`คำอ่านที่ถูกต้องคือ ${d[1]}`,()=>i<9?base1(i+1):baseDone(1))}
function base2(i){let d=b2[i];baseChoice(7,2,i,5,d[0],d[1],d[2],`คำที่เติมถูกต้องคือ “${d[2]}”`,()=>i<4?base2(i+1):baseDone(2))}
function baseChoice(bgidx,n,i,total,q,opts,ans,explain,next){
 clear();setBg(bgidx);showHud(true);let sel=null,p=document.createElement('div');p.className='panel question';p.innerHTML=`<h2>ฐานที่ ${n} • ข้อ ${i+1}/${total}</h2><p><b>${q}</b></p><div class="options">${opts.map(o=>`<button class="opt">${o}</button>`).join('')}</div><div class="action"><button class="bigbtn">ส่งคำตอบ</button><button class="bigbtn secondary hint">คำใบ้</button></div><div class="feedback"></div>`;ui.appendChild(p);p.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{p.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b.textContent;click()});p.querySelector('.hint').onclick=()=>say('สังเกตเสียงพยางค์หลังและรูปคำอักษรนำ');p.querySelector('.bigbtn').onclick=()=>{if(sel===null)return say('เลือกคำตอบก่อน');let ok=sel===ans;sfx(ok);if(ok){state.stars+=5;state.correct[n-1]++;}else state.stars=Math.max(0,state.stars-1);showHud(true);p.querySelector('.feedback').innerHTML=(ok?'✅ ถูกต้อง +5 ดาว':'❌ ยังไม่ถูกต้อง -1 ดาว')+'<br>'+explain;p.querySelectorAll('button').forEach(b=>b.disabled=true);setTimeout(next,1200)}}
function base3(i){clear();setBg(8);showHud(true);let d=pics[i],p=document.createElement('div');p.className='panel question';p.innerHTML=`<h2>ฐานที่ 3 • ไขรหัสลับ ${i+1}/10</h2><div class="wordpic">${d[1]}</div><p style="text-align:center"><b>ภาพปริศนานี้คือคำว่าอะไร?</b></p><input class="textinput" placeholder="พิมพ์คำตอบที่นี่"><div class="action"><button class="bigbtn">ส่งคำตอบ</button><button class="bigbtn secondary">คำใบ้</button></div><div class="feedback"></div>`;ui.appendChild(p);let inp=p.querySelector('input');p.querySelectorAll('button')[1].onclick=()=>say('คำตอบเป็นคำภาษาไทยตามภาพ');p.querySelector('button').onclick=()=>{let ok=inp.value.trim()===d[0];sfx(ok);if(ok){state.stars+=5;state.correct[2]++}else state.stars=Math.max(0,state.stars-1);showHud(true);p.querySelector('.feedback').innerHTML=(ok?'✅ ถูกต้อง +5 ดาว':'❌ ยังไม่ถูกต้อง -1 ดาว')+`<br>เฉลย: ${d[0]}`;p.querySelectorAll('button,input').forEach(x=>x.disabled=true);setTimeout(()=>i<9?base3(i+1):baseDone(3),1200)}}
function base4(i){clear();setBg(9);showHud(true);let d=b4[i],p=document.createElement('div');p.className='panel summary';p.innerHTML=`<h2>ฐานที่ 4 • ข้อ ${i+1}/5</h2><p><b>${d[0]} อ่านว่า .........................................</b></p><input class="textinput" placeholder="พิมพ์คำอ่าน"><div class="action"><button class="bigbtn">ส่งคำตอบ</button><button class="bigbtn secondary">คำใบ้</button></div><div class="feedback"></div>`;ui.appendChild(p);let inp=p.querySelector('input');p.querySelectorAll('button')[1].onclick=()=>say('พยางค์แรกออกเสียง อะ กึ่งเสียง');p.querySelector('button').onclick=()=>{let ok=inp.value.trim().replace(/\s/g,'')===d[1].replace(/\s/g,'');sfx(ok);if(ok){state.stars+=5;state.correct[3]++}showHud(true);p.querySelector('.feedback').innerHTML=(ok?'✅ ถูกต้อง +5 ดาว':'❌ ไม่ได้ดาว')+`<br>เฉลย: ${d[1]}`;p.querySelectorAll('button,input').forEach(x=>x.disabled=true);setTimeout(()=>i<4?base4(i+1):baseDone(4),1200)}}
function baseDone(n){state.base=Math.max(state.base,n);clear();setBg([6,7,8,9][n-1]);showHud(true);let p=document.createElement('div');p.className='panel mission';p.innerHTML=`<h2>สรุปผลฐานที่ ${n}</h2><p style="text-align:center;font-size:1.5em">⭐ ดาวสะสม ${state.stars}<br>ตอบถูก ${state.correct[n-1]} ข้อ</p><div class="action"><button class="bigbtn">${n<4?'ปลดล็อกฐานต่อไป':'ทำแบบทดสอบหลังเรียน'}</button></div>`;ui.appendChild(p);p.querySelector('button').onclick=()=>n<4?pageMap():testScreen('post',0,0)}
function finish(){clear();setBg(11);showHud(true);let passed=state.stars>=80;let p=document.createElement('div');p.className='panel summary';p.innerHTML=`<h2>ภารกิจสำเร็จ</h2><div class="certname">${state.name}</div><p style="text-align:center">คะแนนสอบก่อนเรียน: <b>${state.pre}/10</b><br>คะแนนสอบหลังเรียน: <b>${state.post}/10</b><br>ดาวรวมจากภารกิจ: <b>${state.stars}</b></p><p style="text-align:center"><b>${passed?'ขอแสดงความยินดี กับผู้ที่ทำคะแนนผ่านเกณฑ์ ได้รับเกียรติบัตร และตั๋วพิเศษสำหรับกล่องจุ่มรางวัล':'ทำภารกิจครบแล้ว ลองทบทวนและเล่นอีกครั้งเพื่อสะสมให้ถึง 80 คะแนน'}</b></p><div class="action"><button class="bigbtn">เล่นใหม่</button></div>`;ui.appendChild(p);p.querySelector('button').onclick=()=>{state={name:'',char:'หญิง',stars:0,pre:0,post:0,base:0,correct:[0,0,0,0],music:state.music};pageCover()}}

const videoIntro=document.getElementById('videoIntro');
const introVideo=document.getElementById('introVideo');
document.getElementById('playIntro').onclick=async()=>{
  try{ await introVideo.play(); }catch(e){}
};
function enterGame(){
  try{introVideo.pause(); introVideo.currentTime=0;}catch(e){}
  videoIntro.style.display='none';
  pageCover();
}
document.getElementById('skipIntro').onclick=enterGame;
introVideo.addEventListener('ended',()=>{ document.getElementById('skipIntro').textContent='เข้าสู่เกม ▶'; });

pageCover();
</script></body></html>
